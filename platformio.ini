; Capsule Radar — Waveshare ESP32-S3-Touch-AMOLED-1.75
;
; Two environments:
;   esp32-s3-amoled-175  -> real firmware (Arduino_GFX + LVGL), flashed to the board
;   native               -> desktop LVGL simulator (SDL2), runs the same UI on the Mac
;
; Build/run the simulator:   pio run -e native -t exec
; Build/flash the device:    pio run -e esp32-s3-amoled-175 -t upload

[env:esp32-s3-amoled-175]
; pioarduino fork of the espressif32 platform (Arduino core 3.x / ESP-IDF 5.x).
; This exact release is what the reference board builds use and is already installed
; locally; swap to "espressif32" (registry) if you prefer the official platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1      ; generic S3; matches ESP32-S3R8 (8MB PSRAM / 16MB flash)
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; sim_main.cpp + sim_knob.cpp are desktop-only (own main() + SDL, and a software
; encoder that would clash with the real knob.cpp); native_http.cpp is the desktop
; libcurl transport (no libcurl on the ESP32 toolchain) — all three stay out of the firmware
; touch_cst9217.cpp is excluded on purpose: the Orb is knob-only (docs/ARCHITECTURE.md,
; and section 2 of orb-user-requirements.md). The driver stays in the repo, working and
; tested, so a future touch feature would not start from scratch, but it costs zero
; bytes while nothing registers a pointer indev.
build_src_filter = +<*> -<sim_main.cpp> -<sim_knob.cpp> -<native_http.cpp> -<touch_cst9217.cpp>

; ESP32-S3R8: QIO flash + OPI PSRAM, 16 MB flash + matching partition table
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; Stock default_16MB.csv with its never-used SPIFFS partition replaced by `themeart`:
; pre-baked RGB565 art, memory-mapped and drawn straight out of flash. nvs offset/size
; are byte-identical to the stock table, so saved WiFi credentials survive the switch.
board_build.partitions = partitions_16MB_themeart.csv

; --- Weather radar / TLS memory work: DISABLED, reverted to the stable prebuilt-libs
;     build. Tonight's experiment moved mbedTLS's TLS buffers into PSRAM via a custom
;     ESP-IDF component rebuild (custom_sdkconfig CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y +
;     SPIRAM_MODE_OCT, plus custom_component_remove to trim the pulled-in component tree,
;     plus an esp-dsp add-back in .dummy/idf_component.yml). It built and flashed, but the
;     device is memory-constrained enough that this only RELOCATED the '-32512 SSL memory
;     allocation failed' failure from internal RAM into PSRAM: the weather radar's own
;     heavy buffers then exhaust PSRAM and TLS fails there too, plus the road-overlay
;     projection trips the task watchdog into a reboot loop. The right fix is not a bigger
;     memory budget but a LEANER weather app (single fixed 50mi radius, ~3 frames, and a
;     one-time 'burn-in' road overlay rendered once per location instead of re-projected
;     ~43k trig points repeatedly). Until that redesign lands, this stays on the simple,
;     robust prebuilt-libs path. The full custom_sdkconfig/custom_component_remove block
;     and its verification notes are preserved in git history (and the .dummy esp-dsp add)
;     for whoever picks the redesign back up.

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0              ; silence Arduino library [E] spam (Wire I2C -1/263, ssl_client);
                                      ;   our own Serial.printf [adsb]/[gps]/[wifi] logs are unaffected
    -DPNG_MAX_BUFFERED_PIXELS=8192    ; 512px RGBA scanlines with headroom (4098 was the exact minimum -> right-edge corruption)
    -DLV_CONF_INCLUDE_SIMPLE          ; LVGL does #include "lv_conf.h"
    -I"${PROJECT_DIR}/include"        ; ...and finds it here (PIO's auto include/ is not on the LIBRARY path)
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4   ; has Arduino_CO5300 + Arduino_ESP32QSPI
    lvgl/lvgl @ 8.4.0                                  ; lv_conf.h in include/ targets v8
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    lewisxhe/XPowersLib                               ; AXP2101 battery gauge
    bodmer/TJpg_Decoder                               ; JPEG decode for aircraft photos
    mikalhart/TinyGPSPlus                             ; NMEA parsing for the LC76G GPS (-G variant)
    bitbank2/PNGdec                                   ; decode RainViewer radar tiles into RGB565
; Notes:
; - lv_conf.h lives in include/ (added to the include path above).
; - Versions are pinned to a known-good combination for this panel; bump deliberately.

; --- OTA upload (flash over WiFi) -------------------------------------------
; Device must be powered and on WiFi. Then:  pio run -e esp32-s3-amoled-175-ota -t upload
[env:esp32-s3-amoled-175-ota]
extends = env:esp32-s3-amoled-175
upload_protocol = espota
upload_port = capsuleradar.local

; --- Desktop LVGL simulator (SDL2) -------------------------------------------
[env:native]
platform = native
; The portable UI + real weather/location fetch pipeline, ported to run on the desktop's
; real network stack (libcurl in native_http.cpp / net_fetch.cpp) instead of WiFi/HTTPClient,
; so the simulator shows genuine RainViewer radar + real location data, not mock placeholders.
; wx_radar_client.cpp/roads.cpp/net_fetch.cpp/native_http.cpp are the fetch+decode+overlay
; pipeline; location_view.cpp's own HTTP path branches the same way internally.
build_src_filter = -<*> +<radar_view.cpp> +<ui.cpp> +<route.cpp> +<photo.cpp> +<weather.cpp> +<wx_radar.cpp> +<wx_radar_client.cpp> +<cloud_image.cpp> +<coastline.cpp> +<roads.cpp> +<roads_sd.cpp> +<airports.cpp> +<clock_view.cpp> +<location_view.cpp> +<intel_view.cpp> +<intel_client.cpp> +<intel.cpp> +<app_shell.cpp> +<app_theme.cpp> +<settings_view.cpp> +<splash_art.cpp> +<office_sprite.cpp> +<custom_sprite.cpp> +<radar_sprite.cpp> +<menu_sprite.cpp> +<menu_text.cpp> +<settings_sprite.cpp> +<settings_text.cpp> +<theme_sd.cpp> +<theme_select.cpp> +<theme_style.cpp> +<theme_art.cpp> +<theme_art_bake.cpp> +<theme_font.cpp> +<custom_settings_font1.c> +<custom_font1.c> +<custom_font2.c> +<custom_radar_font1.c> +<custom_radar_font2.c> +<custom_radar_font3.c> +<custom_radar_font4.c> +<custom_menu_font1.c> +<custom_menu_font2.c> +<custom_menu_font3.c> +<input_router.cpp> +<net_fetch.cpp> +<native_http.cpp> +<sim_knob.cpp> +<sim_main.cpp>
; PNGdec is a legacy Arduino-format library (library.properties, no library.json) — PIO's
; Library Dependency Finder drops it as "incompatible" with the native platform/no framework
; even though its source has zero Arduino dependency (verified: builds clean). Force it in.
lib_compat_mode = off
build_flags =
    !sdl2-config --cflags --libs      ; SDL2 include/lib flags (Homebrew sdl2)
    -lcurl                            ; real HTTPS fetches (RainViewer, geocode, weather, trivia); ships with macOS
    -DPNG_MAX_BUFFERED_PIXELS=8192    ; same fix as the device env: 512px RGBA scanlines need this (4096 -> right-edge corruption)
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -DLV_LOG_PRINTF=1
    -DLV_MEM_SIZE_NATIVE_OVERRIDE=1048576U
    -std=gnu++17
lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    bitbank2/PNGdec                                   ; same decoder as the device — identical decode output
