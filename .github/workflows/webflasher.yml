name: Build firmware

# Builds the ESP32-S3 firmware and merges it into a single flashable binary,
# then attaches that binary to the run so it can be downloaded from the
# Actions tab.
#
# No GitHub Pages deploy: the web flasher for this project is Orb Studio,
# hosted separately on Cloudflare.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e esp32-s3-amoled-175

      - name: Merge into a single flashable binary
        run: |
          B=.pio/build/esp32-s3-amoled-175
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin -path '*framework-arduinoespressif32*' | head -1)"
          mkdir -p site
          cp web/flash/index.html web/flash/manifest.json site/
          # stamp the flasher page + manifest with the firmware version being built
          VER=$(grep -oE 'FW_VERSION "[0-9.]+"' src/config.h | grep -oE '[0-9.]+' | head -1)
          sed -i "s/__FWVER__/${VER:-dev}/g" site/index.html site/manifest.json
          python -m esptool --chip esp32s3 merge_bin -o site/CapsuleRadar-esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: site
